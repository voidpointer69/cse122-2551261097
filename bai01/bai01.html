<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:type" content="website">
    <meta property="og:title" content="BỐN MÙA">
    <meta property="og:description" content="Trang web về bài thơ bốn mùa">
    <title>BỐN MÙA</title>
    <style>
      :root{
        --blue: #0033CC;
        --red: #D40000;
        --mau-khung: #9E9E9E;
        --nen-khung: #FFFDE7;
      }
      body{
        justify-content: center;
        align-items: center;
      }
      hr{
        border-color: var(--blue);
        width: 55%;
      }
      .khung-tho{
        background-color: var(--nen-khung);
        border: solid var(--mau-khung);
        width: 640px;
        padding: 24px;
        text-align: center;
      }
      .kho-xanh, .kho-do{
        font-style: italic;
        line-height: 1.7;
      }
      .kho-xanh{
        color: var(--blue);
      }
      .kho-do{
        color: var(--red);
      }
      #ten-bai-tho{
        color: var(--red);
        background-color: #FFD9E6;
        font-size: 26px;
        padding: 6px 0;
        margin: 0 0 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <article class="khung-tho">
        <header>
          <h1 id="ten-bai-tho">BỐN MÙA</h1>
        </header>
        <p class="kho-xanh">
          Xuân về hoa nở khắp trời
          <br>Hạ sang nắng cháy rạng ngời phố quen
          <br>Thu về lá rụng bên thềm
        </p>
        <hr>
        <p class="kho-do">
          Đông sang gió lạnh bên em đợi chờ
          <br>Bốn mùa là bốn giấc mơ
          <br>Thời gian đi mãi ta chờ đợi ai
        </p>
        <hr>
        <p class="kho-xanh">
          Một năm rồi lại một năm
          <br>Vẫn còn câu hát thì thầm quê hương
          <br>Chờ xuân nắng mới soi đường
        </p>
      </article>
    </main>
  </body>
</html>
